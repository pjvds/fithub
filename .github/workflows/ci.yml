name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Backend / shared packages
      - name: Backend: lint
        run: npm run lint
      - name: Backend: typecheck
        run: npm run typecheck
      - name: Backend: unit tests with coverage
        run: npm run test:coverage

      # Web frontend
      - name: Astro type-check
        run: npm -w @fithub/web run check
      - name: Web TypeScript check
        run: npm -w @fithub/web run typecheck
      - name: Web lint
        run: npx eslint web/src --ext .ts,.tsx
      - name: Web unit tests with coverage
        run: npm -w @fithub/web run test:coverage

      # Coverage reporting
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - name: Write coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin).get('total', {})
          for k in ['lines', 'statements', 'branches', 'functions']:
              v = d.get(k, {})
              print(f'{k:12}: {v.get(\"pct\", 0):.1f}%  ({v.get(\"covered\", 0)}/{v.get(\"total\", 0)})')
          " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage summary found." >> $GITHUB_STEP_SUMMARY
          fi

      # Build verification
      - name: Web build verification
        run: npm -w @fithub/web run build

  deploy-dev:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy to dev stage
        run: npx sst deploy --stage dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
