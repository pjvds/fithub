name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Backend / shared packages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Web frontend
      - name: Astro type-check
        run: npm -w @fithub/web run check
      - name: Web TypeScript check
        run: npm -w @fithub/web run typecheck
      - name: Web lint
        run: npx eslint web/src --ext .ts,.tsx
      - name: Web unit tests
        run: npm -w @fithub/web run test
